.blk{padding:10px 0}
.blk .lab{margin-bottom:7px}
.blk b{display:block;font-weight:600;font-size:14px;line-height:1.8}
.stamp{width:60px;height:60px;border:2px double #a9adb8;border-radius:50%;color:#a9adb8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transform:rotate(-18deg);margin:2px 2px 2px 0;position:relative}
.stamp.running{color:var(--run);border-color:var(--run);box-shadow:inset 0 0 0 1px var(--run);letter-spacing:0}
.stamp.running:before,.stamp.running:after{content:"✦  ✦";position:absolute;font-size:7px;letter-spacing:3px}
.stamp.running:before{top:5px}
.stamp.running:after{bottom:5px}
.stamp.ok{color:#22a06b;border-color:#22a06b}
.stamp.rej{color:#e5484d;border-color:#e5484d}
.stamp.p{color:var(--bl);border-color:var(--bl)}
.tl{padding:6px 0}
.node{display:flex;align-items:center;padding:10px 0;position:relative;border-bottom:1px solid var(--ln)}
.node:last-child{border:0}
.rail{width:21px;align-self:stretch;position:relative;flex:none}
.rail:before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--bl)}
.rail i{position:absolute;left:1px;top:50%;margin-top:-4px;width:9px;height:9px;border-radius:50%;background:var(--bl)}
.node:first-child .rail:before{top:50%}
.node:last-child .rail:before{bottom:50%}
.av{width:58px;height:58px;border-radius:4px;background:#cfe6ff;flex:none;margin-right:13px;overflow:hidden}
.av.r{border-radius:50%}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.inf{flex:1;min-width:0}
.inf .nm{font-weight:600;font-size:14px}
.inf .tm{color:var(--bl);font-weight:600;font-size:13px}
.inf .cm{font-weight:600;margin-top:4px;display:flex;gap:4px;align-items:center;font-size:13px}
.inf .cm.rejc,.inf .tm.rejc{color:#e5484d}
.inf .cm svg{width:20px;height:20px;flex:none}
.badge{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center}
.badge span{width:56px;height:56px;border-radius:50%;background:var(--bl);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;transform:scale(.78)}
.badge span.wait{background:#c9ccd3}
.badge span.no{background:#e5484d}
.dl{display:block;width:calc(100% - 20px);margin:13px 10px 0;background:var(--bl);color:#fff;border:0;border-radius:8px;padding:13px;font-size:15px}
.demo{margin:9px 10px;padding:11px 14px}
.demo h4{margin:0 0 7px;font-size:13px;color:var(--sub)}
.demo input,.form input,.form select,.form textarea{width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.btns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.btn{flex:1;min-width:78px;padding:9px;border-radius:6px;border:1px solid var(--bl);background:transparent;color:var(--bl);font:inherit}
.btn.pri{background:var(--bl);color:#fff}
.btn.red{border-color:#e5484d;color:#e5484d}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{flex:1;text-align:center;padding:7px 0;color:var(--sub);font-size:13px}
nav div.on{color:var(--bl)}
nav svg{display:block;margin:0 auto 1px}
.empty{text-align:center;color:var(--mut);padding:55px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
#sheet .p{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:14px 14px 0 0;max-height:88vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.form label{display:block;font-size:13px;color:var(--sub);margin:9px 0 3px}
.form h3{font-size:17px}
.section-title{margin:14px 0 4px;padding-top:9px;border-top:1px solid var(--ln);font-weight:600}
.filebox{border:1px dashed #b9bec8;border-radius:7px;padding:9px;background:var(--bg);margin-top:4px}
.filebox input[type=file]{padding:4px;border:0;background:transparent}
.preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.preview img{width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--ln)}
.avatar-preview{width:70px;height:70px;border-radius:50%;object-fit:cover;display:block;margin:6px 0;border:1px solid var(--ln)}
.fab{position:fixed;right:12px;bottom:72px;width:46px;height:46px;border-radius:50%;background:var(--bl);color:#fff;border:0;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:5}
.small-note{font-size:12px;color:var(--mut);margin-top:4px}
.reason-block b{font-size:14px;line-height:1.9;font-weight:600}
.location-block b{font-size:14px;line-height:1.8;text-align:left}
.card>.row .lab{font-size:14px}
.card>.row b{font-size:14px}
</style></head>
<body>
<div id="app"></div>
<div id="sheet"><div class="p"><div class="form" id="form"></div></div></div>
<script>
const KEY="leave_flow_v2";
const pad=n=>String(n).padStart(2,"0");
const now=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const defaultState=()=>({status:"running",type:"事假",start:"2026-04-30 07:00",end:"2026-04-30 12:00",phone:"13800000000",loc:"陕西省西安市新城区解放门街道西七路",
reason:"尊敬的老师您好，我因家中有事，需提前请假回家。在外期间保证电话畅通，一切人身安全由自身负责。望老师批准",
out:"否",attach:"未上传",attachments:[],avatar:"",student:"张凯歌",counselor:"党建雄",dean:"曾维民",t0:"2026-04-29 17:10",
c1:{time:"2026-04-29 17:11",text:"同意,情况属实,注意安全"},c2:{time:"2026-04-29 22:26",text:"同意审批"},cancel:{by:"张凯歌",time:"2026-05-09 12:58"},tab:0,rejAt:0});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaultState()}catch(e){S=defaultState()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stamp={running:["进行中","running"],p1:["审批中","p"],p2:["审批中","p"],ok:["已通过","ok"],rej:["已驳回","rej"],void:["已销假",""]};
const face=c=>`<svg viewBox="0 0 74 74"><rect width="74" height="74" fill="${c}"/><circle cx="37" cy="30" r="14" fill="#ffe0c2"/><path d="M22 28q0-16 15-16t15 16q-6-8-15-8t-15 8z" fill="#222"/><circle cx="32" cy="32" r="2" fill="#222"/><circle cx="42" cy="32" r="2" fill="#222"/><path d="M8 74q0-22 29-22t29 22z" fill="#5aa9ff"/></svg>`;
const spk=`<svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#3b82f6"/><path d="M15 9a4 4 0 010 6" stroke="#3b82f6" fill="none" stroke-width="2"/></svg>`;
const chk=`<svg width="36" height="36" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="2.4" fill="none"/></svg>`;
const clk=`<svg width="36" height="36" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2" fill="none"/><path d="M12 7v5l3 2" stroke="#fff" stroke-width="2" fill="none"/></svg>`;
const xx=`<svg width="36" height="36" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.4"/></svg>`;
function avatarHtml(){return S.avatar?`<img src="${S.avatar}" alt="学生头像">`:face("#cfd8e3")}
function node(av,name,time,cm,badge,cls=""){return `<div class="node"><div class="rail"><i></i></div><div class="av ${av[1]}">${av[0]}</div><div class="inf"><div class="nm">${esc(name)}</div><div class="tm ${cls}">${esc(time)}</div>${cm?`<div class="cm ${cls}">${spk}<span>${esc(cm)}</span></div>`:""}</div><div class="badge">${badge}</div></div>`}
function render(){
const st=S.status;const [sn,sc]=stamp[st]||stamp.running;
const passed1=["p2","ok","void","running"].includes(st)||(st==="rej"&&S.rejAt===2);
const passed2=["ok","void","running"].includes(st);
let tl=node([avatarHtml(),""],S.student+"(学生)","发起审批: "+S.t0,"",`<span>我</span>`);
if(passed1){tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","审批通过 "+S.c1.time,S.c1.text,`<span>${chk}</span>`)}
else if(st==="rej"&&S.rejAt===1){tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","审批驳回 "+S.c1.time,S.c1.text,`<span class="no">${xx}</span>`,"rejc")}
else{tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","待审批","",`<span class="wait">${clk}</span>`)}
if(passed2){tl+=node([face("#bfe0ff"),"r"],S.dean+"(院级)","审批通过 "+S.c2.time,S.c2.text,`<span>${chk}</span>`)}
else if(st==="rej"&&S.rejAt===2){tl+=node([face("#bfe0ff"),"r"],S.dean+"(院级)","审批驳回 "+S.c2.time,S.c2.text,`<span class="no">${xx}</span>`,"rejc")}
else if(st!=="rej"){tl+=node([face("#bfe0ff"),"r"],S.dean+"(院级)","待审批","",`<span class="wait">${clk}</span>`)}
let act="";
const ci=`<input id="cm" placeholder="审批意见（可选）">`;
if(st==="p1"){act=`<h4>演示操作 · 当前待 ${esc(S.counselor)}(辅导员) 审批</h4>${ci}<div class="btns"><button class="btn pri" onclick="act('a1')">同意</button><button class="btn red" onclick="act('r1')">驳回</button></div>`}
if(st==="p2"){act=`<h4>演示操作 · 当前待 ${esc(S.dean)}(院级) 审批</h4>${ci}<div class="btns"><button class="btn pri" onclick="act('a2')">同意</button><button class="btn red" onclick="act('r2')">驳回</button></div>`}
if(st==="ok"||st==="running"){act=`<h4>演示操作 · 审批已通过，当前请假进行中</h4><div class="btns"><button class="btn pri" onclick="act('cancel')">销假</button></div>`}
act+=`<div class="btns"><button class="btn" onclick="act('new')">重新发起申请</button><button class="btn" onclick="act('reset')">恢复示例</button></div>`;
let main;
if(S.tab===0){
const attachmentText=S.attachments?.length?`已上传 ${S.attachments.length} 张图片`:(S.attach||"未上传");
const attachmentPreview=(S.attachments||[]).map(x=>`<img src="${x}" alt="附件">`).join("");
main=`<div class="card"><div class="row" style="min-height:90px"><span class="lab">当前状态</span><div class="stamp ${sc}">${sn}</div></div>
<div class="row"><span class="lab">请假类型</span><b>${esc(S.type)}</b></div>
<div class="row"><span class="lab">开始时间</span><b>${esc(S.start)}</b></div>
<div class="row"><span class="lab">结束时间</span><b>${esc(S.end)}</b></div>
<div class="row"><span class="lab">紧急联系人电话</span><b>${esc(S.phone)}</b></div>
<div class="blk location-block"><div class="lab">当前位置</div><b>${esc(S.loc)}</b></div></div>
<div class="card"><div class="blk reason-block"><div class="lab">请假事由</div><b>${esc(S.reason)}</b></div></div>
<div class="card"><div class="row"><span class="lab">是否出校</span><span style="font-size:14px;font-weight:600">${esc(S.out)}</span></div></div>
<div class="card"><div class="blk"><div style="font-size:16px">其他信息</div><b style="font-size:16px;margin-top:7px">1.附件上传</b><div style="color:var(--mut);padding:5px 0 8px 28px;font-size:14px">${esc(attachmentText)}</div>${attachmentPreview?`<div class="preview" style="padding-left:28px">${attachmentPreview}</div>`:""}</div></div>
${st==="void"?`<div class="card"><div class="blk"><div class="lab">销假详情</div><b style="font-size:17px">销假人: ${esc(S.cancel.by)}<br>销假时间: ${esc(S.cancel.time)}</b></div></div>`:""}
<div class="card"><div class="blk" style="padding-bottom:0"><div class="lab">请假审批信息</div></div><div class="tl">${tl}</div></div>
<button class="dl" onclick="dl()">下载假条</button>
<div class="card demo">${act}</div>`;
}else{main=`<div class="empty">${S.tab===1?"暂无延期信息":"暂无行程单"}</div>`}
const ic=d=>`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/>${d}</svg>`;
document.getElementById("app").innerHTML=`<header>我在校园<span class="cap">•••　◎</span></header>${main}
<button class="fab" onclick="openForm()">编辑</button>
<nav>${["请假信息","延期信息","行程单"].map((n,i)=>`<div class="${S.tab===i?"on":""}" onclick="S.tab=${i};save();render()">${ic(["<path d='M8 9h8M8 13h5'/>","<path d='M12 7v5l3 2'/>","<path d='M8 10h8M8 14h4'/>"][i])}${n}</div>`).join("")}</nav>`;
}
function act(a){const c=(document.getElementById("cm")||{}).value||"";
if(a==="a1"){S.status="p2";S.c1={time:now(),text:c||"同意,情况属实,注意安全"}}
if(a==="r1"){S.status="rej";S.rejAt=1;S.c1={time:now(),text:c||"不同意"}}
if(a==="a2"){S.status="running";S.c2={time:now(),text:c||"同意审批"}}
if(a==="r2"){S.status="rej";S.rejAt=2;S.c2={time:now(),text:c||"不同意"}}
if(a==="cancel"){S.status="void";S.cancel={by:S.student,time:now()}}
if(a==="new"){S.status="p1";S.t0=now();S.rejAt=0}
if(a==="reset"){S=defaultState()}
save();render()}
function fileToDataURL(file,maxSize=1000,quality=.82){
return new Promise((resolve,reject)=>{
if(!file){reject(new Error("没有文件"));return}
const reader=new FileReader();
reader.onload=e=>{const img=new Image();
img.onload=()=>{let w=img.width;let h=img.height;
const scale=Math.min(1,maxSize/Math.max(w,h));
w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
const c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
resolve(c.toDataURL("image/jpeg",quality))};
img.onerror=reject;img.src=e.target.result};
reader.onerror=reject;reader.readAsDataURL(file)})}
const F=[["type","请假类型","sel",["事假","病假","公假","其他"]],["start","开始时间"],["end","结束时间"],["phone","紧急联系人电话"],["loc","当前位置"],["reason","请假事由","ta"],["out","是否出校","sel",["是","否"]],["attach","附件上传显示文字"],["student","学生姓名"],["counselor","辅导员姓名"],["dean","院级审批人姓名"],["t0","发起审批时间"]];
function openForm(){
document.getElementById("form").innerHTML=`<h3 style="margin:0">自定义内容</h3>
${F.map(([k,l,t,o])=>`<label>${l}</label>`+(t==="sel"?`<select id="f_${k}">${o.map(x=>`<option ${S[k]===x?"selected":""}>${x}</option>`).join("")}</select>`:t==="ta"?`<textarea id="f_${k}" rows="3">${esc(S[k])}</textarea>`:`<input id="f_${k}" value="${esc(S[k])}">`)).join("")}
<div class="section-title">学生头像</div>
${S.avatar?`<img id="avatarPreview" class="avatar-preview" src="${S.avatar}" alt="头像预览">`:`<div class="small-note">当前未设置头像，将显示默认头像</div>`}
<div class="filebox"><input id="avatarFile" type="file" accept="image/*"><div class="small-note">点击即可从手机相册选择学生头像</div></div>
<div class="section-title">附件图片</div>
<div class="filebox"><input id="attachFiles" type="file" accept="image/*" multiple><div class="small-note">可一次选择多张手机相册图片，保存后显示在“附件上传”区域</div></div>
<div id="attachPreview" class="preview">${(S.attachments||[]).map(x=>`<img src="${x}" alt="附件预览">`).join("")}</div>
<div class="section-title">审批时间（可编辑）</div>
<label>辅导员审批通过时间</label><input id="f_c1time" value="${esc(S.c1.time)}" placeholder="例如：2026-04-29 17:11">
<label>院级审批通过时间</label><input id="f_c2time" value="${esc(S.c2.time)}" placeholder="例如：2026-04-29 22:26">
<label>辅导员审批意见</label><input id="f_c1text" value="${esc(S.c1.text)}">
<label>院级审批意见</label><input id="f_c2text" value="${esc(S.c2.text)}">
<label>状态（直接指定）</label>
<select id="f_status">${Object.entries(stamp).map(([k,v])=>`<option value="${k}" ${S.status===k?"selected":""}>${v[0]}${k==="p1"?"（待辅导员）":k==="p2"?"（待院级）":""}</option>`).join("")}</select>
<div class="btns"><button class="btn" onclick="closeForm()">取消</button><button class="btn pri" onclick="applyForm()">保存</button></div>`;
document.getElementById("avatarFile").addEventListener("change",async e=>{
const file=e.target.files[0];if(!file)return;
try{S._pendingAvatar=await fileToDataURL(file,500,.86);
const box=document.getElementById("avatarPreview");
if(box){box.src=S._pendingAvatar}else{
const img=document.createElement("img");img.id="avatarPreview";img.className="avatar-preview";img.src=S._pendingAvatar;img.alt="头像预览";
e.target.parentElement.parentElement.insertBefore(img,e.target.parentElement)}
}catch(err){alert("头像读取失败，请重新选择图片")}});
document.getElementById("attachFiles").addEventListener("change",async e=>{
const files=[...e.target.files];if(!files.length)return;
try{const arr=[];for(const file of files){arr.push(await fileToDataURL(file,1100,.78))}
S._pendingAttachments=[...(S.attachments||[]),...arr];
document.getElementById("attachPreview").innerHTML=S._pendingAttachments.map(x=>`<img src="${x}" alt="附件预览">`).join("");
}catch(err){alert("附件读取失败，请重新选择图片")}});
document.getElementById("sheet").style.display="block"}
function closeForm(){document.getElementById("sheet").style.display="none"}
function applyForm(){
F.forEach(([k])=>S[k]=document.getElementById("f_"+k).value);
const ns=document.getElementById("f_status").value;
S.c1.time=document.getElementById("f_c1time").value||S.c1.time;
S.c2.time=document.getElementById("f_c2time").value||S.c2.time;
S.c1.text=document.getElementById("f_c1text").value;
S.c2.text=document.getElementById("f_c2text").value;
if(S._pendingAvatar){S.avatar=S._pendingAvatar;delete S._pendingAvatar}
if(S._pendingAttachments){S.attachments=S._pendingAttachments;S.attach=S.attachments.length?`已上传 ${S.attachments.length} 张图片`:"未上传";delete S._pendingAttachments}
S.status=ns;
if(ns==="rej"&&!S.rejAt)S.rejAt=1;
if(ns!=="rej")S.rejAt=0;
S.cancel=S.cancel||{by:S.student,time:now()};
S.cancel.by=S.student;
save();closeForm();render()}
function dl(){
const t=`请假条
姓名：${S.student}
请假类型：${S.type}
开始时间：${S.start}
结束时间：${S.end}
紧急联系人电话：${S.phone}
当前位置：${S.loc}
请假事由：${S.reason}
是否出校：${S.out}
状态：${stamp[S.status]?.[0]||"进行中"}
审批：${S.counselor}(辅导员) ${S.c1.time} ${S.c1.text}；${S.dean}(院级) ${S.c2.time} ${S.c2.text}
`;
const a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));
a.download="假条.txt";a.click()}
render();
