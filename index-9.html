<script>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stamp={running:["进行中","running"],p1:["审批中","p"],p2:["审批中","p"],ok:["已通过","ok"],rej:["已驳回","rej"],void:["已销假",""]};
const face=c=>`<svg viewBox="0 0 74 74"><rect width="74" height="74" fill="${c}"/><circle cx="37" cy="30" r="14" fill="#ffe0c2"/><path d="M22 28q0-16 15-16t15 16q-6-8-15-8t-15 8z" fill="#222"/><circle cx="32" cy="32" r="2" fill="#222"/><circle cx="42" cy="32" r="2" fill="#222"/><path d="M8 74q0-22 29-22t29 22z" fill="#5aa9ff"/></svg>`;

const chk=`<svg width="36" height="36" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" stroke="#fff" stroke-width="2.4" fill="none"/></svg>`;
const clk=`<svg width="36" height="36" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2" fill="none"/><path d="M12 7v5l3 2" stroke="#fff" stroke-width="2" fill="none"/></svg>`;

function PR(){try{return parent.getProfile&&parent.getProfile()}catch(e){return null}}
function avatarHtml(){const p=PR(),a=S.avatar||(p&&(p.avatar||p.defav));return a?`<img src="${a}" alt="学生头像">`:face("#cfd8e3")}
function node(av,name,time,cm,badge,cls=""){return `<div class="node"><div class="rail"><i></i></div><div class="av ${av[1]}">${av[0]}</div><div class="inf"><div class="nm">${esc(name)}</div><div class="tm ${cls}">${esc(time)}</div>${cm?`<div class="cm ${cls}">${spk}<span>${esc(cm)}</span></div>`:""}</div><div class="badge">${badge}</div></div>`}
function render(){
const _p=PR();if(_p&&!S.stuManual){S.student=_p.hname;S.cancel.by=_p.hname}
const st=S.status;const [sn,sc]=stamp[st]||stamp.running;
const passed1=["p2","ok","void","running"].includes(st)||(st==="rej"&&S.rejAt===2);
const passed2=["ok","void","running"].includes(st);
let tl=node([avatarHtml(),""],S.student+"(学生)","发起审批: "+S.t0,"",`<span>我</span>`);
if(passed1){tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","审批通过 "+S.c1.time,S.c1.text,`<span>${chk}</span>`)}
else if(st==="rej"&&S.rejAt===1){tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","审批驳回 "+S.c1.time,S.c1.text,`<span class="no">${xx}</span>`,"rejc")}
else{tl+=node([face("#bfe0ff"),"r"],S.counselor+"(辅导员)","待审批","",`<span class="wait">${clk}</span>`)}
if(passed2){tl+=node([face("#bfe0ff"),"r"],S.dean+"(院级)","审批通过 "+S.c2.time,S.c2.text,`<span>${chk}</span>`)}
else if(st==="rej"&&S.rejAt===2){tl+=node([face("#bfe0ff"),"r"],S.dean+"(院级)","审批驳回 "+S.c2.time,S.c2.text,`<span class="no">${xx}</span>`,"rejc")}

let act="";
const ci=`<input id="cm" placeholder="审批意见（可选）">`;
if(st==="p1"){act=`<h4>演示操作 · 当前待 ${esc(S.counselor)}(辅导员) 审批</h4>${ci}<div class="btns"><button class="btn pri" onclick="act('a1')">同意</button><button class="btn red" onclick="act('r1')">驳回</button></div>`}
if(st==="p2"){act=`<h4>演示操作 · 当前待 ${esc(S.dean)}(院级) 审批</h4>${ci}<div class="btns"><button class="btn pri" onclick="act('a2')">同意</button><button class="btn red" onclick="act('r2')">驳回</button></div>`}
if(st==="ok"||st==="running"){act=`<h4>演示操作 · 审批已通过，当前请假进行中</h4><div class="btns"><button class="btn pri" onclick="act('cancel')">销假</button></div>`}
act+=`<div class="btns"><button class="btn" onclick="act('new')">重新发起申请</button><button class="btn" onclick="act('reset')">恢复示例</button></div>`;

if(S.tab===0){
const attachmentText=S.attachments?.length?`已上传 ${S.attachments.length} 张图片`:(S.attach||"未上传");
const attachmentPreview=(S.attachments||[]).map(x=>`<img src="${x}" alt="附件">`).join("");
main=`<div class="card"><div class="row" style="min-height:90px"><span class="lab">当前状态</span><div class="stamp ${sc}">${sn}</div></div>
<div class="row"><span class="lab">请假类型</span><b>${esc(S.type)}</b></div>
<div class="row"><span class="lab">开始时间</span><b>${esc(S.start)}</b></div>
<div class="row"><span class="lab">结束时间</span><b>${esc(S.end)}</b></div>
<div class="row"><span class="lab">紧急联系人电话</span><b>${esc(S.phone)}</b></div>
<div class="blk location-block"><div class="lab">当前位置</div><b>${esc(S.loc)}</b></div></div>
<div class="card"><div class="blk reason-block"><div class="lab">请假事由</div><b>${esc(S.reason)}</b></div></div>
<div class="card"><div class="row"><span class="lab">是否出校</span><span style="font-size:14px;font-weight:600">${esc(S.out)}</span></div></div>
<div class="card"><div class="blk"><div style="font-size:16px">其他信息</div><b style="font-size:16px;margin-top:7px">1.附件上传</b><div style="color:var(--mut);padding:5px 0 8px 28px;font-size:14px">${esc(attachmentText)}</div>${attachmentPreview?`<div class="preview" style="padding-left:28px">${attachmentPreview}</div>`:""}</div></div>
${st==="void"?`<div class="card"><div class="blk"><div class="lab">销假详情</div><b style="font-size:17px">销假人: ${esc(S.cancel.by)}<br>销假时间: ${esc(S.cancel.time)}</b></div></div>`:""}
<div class="card"><div class="blk" style="padding-bottom:0"><div class="lab">请假审批信息</div></div><div class="tl">${tl}</div></div>
<button class="dl" onclick="dl()">下载假条</button>

}else{main=`<div class="empty">${S.tab===1?"暂无延期信息":"暂无行程单"}</div>`}
const ic=d=>`<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/>${d}</svg>`;
document.getElementById("app").innerHTML=`<header>我在校园<span class="cap">•••　◎</span></header>${main}
<button class="fab" onclick="openForm()">编辑</button>
<nav>${["请假信息","延期信息","行程单"].map((n,i)=>`<div class="${S.tab===i?"on":""}" onclick="S.tab=${i};save();render()">${ic(["<path d='M8 9h8M8 13h5'/>","<path d='M12 7v5l3 2'/>","<path d='M8 10h8M8 14h4'/>"][i])}${n}</div>`).join("")}</nav>`;
}
function act(a){const c=(document.getElementById("cm")||{}).value||"";
if(a==="a1"){S.status="p2";S.c1={time:now(),text:c||"同意,情况属实,注意安全"}}
if(a==="r1"){S.status="rej";S.rejAt=1;S.c1={time:now(),text:c||"不同意"}}
if(a==="a2"){S.status="running";S.c2={time:now(),text:c||"同意审批"}}
if(a==="r2"){S.status="rej";S.rejAt=2;S.c2={time:now(),text:c||"不同意"}}
if(a==="cancel"){S.status="void";S.cancel={by:S.student,time:now()}}
if(a==="new"){S.status="p1";S.t0=now();S.rejAt=0}
if(a==="reset"){S=defaultState()}
save();render()}
function fileToDataURL(file,maxSize=1000,quality=.82){
return new Promise((resolve,reject)=>{
if(!file){reject(new Error("没有文件"));return}
const reader=new FileReader();
reader.onload=e=>{const img=new Image();
img.onload=()=>{let w=img.width;let h=img.height;
const scale=Math.min(1,maxSize/Math.max(w,h));
w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
const c=document.createElement("canvas");c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
resolve(c.toDataURL("image/jpeg",quality))};
img.onerror=reject;img.src=e.target.result};
reader.onerror=reject;reader.readAsDataURL(file)})}

<label>院级审批通过时间</label><input id="f_c2time" value="${esc(S.c2.time)}" placeholder="例如：2026-04-29 22:26">

<label>院级审批意见</label><input id="f_c2text" value="${esc(S.c2.text)}">
<label>状态（直接指定）</label>
<select id="f_status">${Object.entries(stamp).map(([k,v])=>`<option value="${k}" ${S.status===k?"selected":""}>${v[0]}${k==="p1"?"（待辅导员）":k==="p2"?"（待院级）":""}</option>`).join("")}</select>
<div class="btns"><button class="btn" onclick="closeForm()">取消</button><button class="btn pri" onclick="applyForm()">保存</button></div>`;
document.getElementById("avatarFile").addEventListener("change",async e=>{
const file=e.target.files[0];if(!file)return;
try{S._pendingAvatar=await fileToDataURL(file,500,.86);
const box=document.getElementById("avatarPreview");
if(box){box.src=S._pendingAvatar}else{
const img=document.createElement("img");img.id="avatarPreview";img.className="avatar-preview";img.src=S._pendingAvatar;img.alt="头像预览";
e.target.parentElement.parentElement.insertBefore(img,e.target.parentElement)}
}catch(err){alert("头像读取失败，请重新选择图片")}});
document.getElementById("attachFiles").addEventListener("change",async e=>{
const files=[...e.target.files];if(!files.length)return;
try{const arr=[];for(const file of files){arr.push(await fileToDataURL(file,1100,.78))}
S._pendingAttachments=[...(S.attachments||[]),...arr];
document.getElementById("attachPreview").innerHTML=S._pendingAttachments.map(x=>`<img src="${x}" alt="附件预览">`).join("");
}catch(err){alert("附件读取失败，请重新选择图片")}});
document.getElementById("sheet").style.display="block"}
function closeForm(){document.getElementById("sheet").style.display="none"}
function applyForm(){
const _os=S.student;
F.forEach(([k])=>S[k]=document.getElementById("f_"+k).value);
if(S.student!==_os)S.stuManual=1;
const ns=document.getElementById("f_status").value;
S.c1.time=document.getElementById("f_c1time").value||S.c1.time;
S.c2.time=document.getElementById("f_c2time").value||S.c2.time;
S.c1.text=document.getElementById("f_c1text").value;
S.c2.text=document.getElementById("f_c2text").value;
if(S._pendingAvatar){S.avatar=S._pendingAvatar;delete S._pendingAvatar}
if(S._pendingAttachments){S.attachments=S._pendingAttachments;S.attach=S.attachments.length?`已上传 ${S.attachments.length} 张图片`:"未上传";delete S._pendingAttachments}
S.status=ns;
if(ns==="rej"&&!S.rejAt)S.rejAt=1;
if(ns!=="rej")S.rejAt=0;
S.cancel=S.cancel||{by:S.student,time:now()};
S.cancel.by=S.student;
save();closeForm();render()}
function dl(){
const t=`请假条
姓名：${S.student}
请假类型：${S.type}
开始时间：${S.start}
结束时间：${S.end}
紧急联系人电话：${S.phone}
当前位置：${S.loc}
请假事由：${S.reason}
是否出校：${S.out}
状态：${stamp[S.status]?.[0]||"进行中"}
审批：${S.counselor}(辅导员) ${S.c1.time} ${S.c1.text}；${S.dean}(院级) ${S.c2.time} ${S.c2.text}
`;
const a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));
a.download="假条.txt";a.click()}
render();

<script>
const $=s=>document.querySelector(s), st=$('#stage');
let sc=1,H=2354;
function fit(){const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
 sc=Math.min(w/1080,h/1850);H=h/sc;
 st.style.left=((w-1080*sc)/2)+'px';
 document.body.style.background=(w/h>0.8)?'#111':'#ededed';
 st.style.height=H+'px';st.style.transform=`scale(${sc})`;
 const f=$('#lf');if(f)f.style.height=(H/2.7692)+'px'}
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();

// chat list
function rnd(a){a=(a*2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HS=(h,s,l)=>`hsl(${Math.round(((h%360)+360)%360)},${s}%,${l}%)`,rr=(r,a,b)=>a+r()*(b-a),pk=(r,a)=>a[Math.floor(r()*a.length)];

const ST={

night(r){const bg=HS(rr(r,215,260),55,rr(r,12,20));let st='';for(let k=0;k<7;k++)st+=`<circle cx="${rr(r,3,37)}" cy="${rr(r,3,37)}" r="${rr(r,.4,.9)}" fill="#fff"/>`;return `<rect width="40" height="40" fill="${bg}"/>${st}<circle cx="25" cy="15" r="7" fill="#f6efc9"/>`+(r()>.4?`<circle cx="28.5" cy="12.5" r="6" fill="${bg}"/>`:'')},
cat(r){const bg=HS(r()*360,rr(r,40,70),rr(r,72,86)),f=pk(r,['#f0c68a','#d9d9de','#3b3b42','#ffffff','#c47a4a','#8c6a4f']),t=Math.floor(r()*3),ey=f==='#3b3b42'?'#fff':'#222';let ears=t==0?`<path d="M9 19L11 5L19 12Z M31 19L29 5L21 12Z" fill="${f}"/>`:t==1?`<circle cx="10" cy="13" r="5" fill="${f}"/><circle cx="30" cy="13" r="5" fill="${f}"/>`:`<ellipse cx="14" cy="10" rx="3.4" ry="9" fill="${f}"/><ellipse cx="26" cy="10" rx="3.4" ry="9" fill="${f}"/>`;return `<rect width="40" height="40" fill="${bg}"/>${ears}<ellipse cx="20" cy="${t==2?26:24}" rx="${t==1?12:13}" ry="${t==2?11:11.5}" fill="${f}"/><circle cx="15" cy="${t==2?25:23}" r="1.6" fill="${ey}"/><circle cx="25" cy="${t==2?25:23}" r="1.6" fill="${ey}"/><ellipse cx="20" cy="${t==2?29:27.5}" rx="1.8" ry="1.2" fill="#e88"/><ellipse cx="12" cy="27" rx="2.2" ry="1.3" fill="#ff9fb0" opacity=".6"/><ellipse cx="28" cy="27" rx="2.2" ry="1.3" fill="#ff9fb0" opacity=".6"/>`},
text(r){const bgs=[['#ffffff','#222'],['#111111','#f4f4f4'],['#f1e6d3','#5a4632'],['#cfe0ff','#25407a'],['#ffd9e2','#a13a58'],['#e5f3e0','#2f6b3c'],['#222c4d','#e9edff']],[b,f]=pk(r,bgs),t=pk(r,TXT),n=t.length;return `<rect width="40" height="40" fill="${b}"/><text x="20" y="${n>1?24:28}" text-anchor="middle" font-size="${n>2?10:n>1?13:22}" font-family="serif" fill="${f}">${t}</text>`},
circles(r){const h=r()*360;let c='';for(let k=0;k<3;k++)c+=`<circle cx="${rr(r,8,32)}" cy="${rr(r,8,32)}" r="${rr(r,8,14)}" fill="${HS(h+k*rr(r,40,120),70,60)}" opacity=".82"/>`;return `<rect width="40" height="40" fill="${HS(h,45,90)}"/>${c}`},
stripes(r){const h=r()*360;let c='';for(let k=0;k<10;k++)c+=`<rect x="${-10+k*8}" y="-20" width="4" height="80" fill="${HS(h+150,65,rr(r,45,65))}"/>`;return `<rect width="40" height="40" fill="${HS(h,60,rr(r,70,88))}"/><g transform="rotate(${pk(r,[30,45,-30,90,0])} 20 20)">${c}</g>`},

person(r){const h=r()*360,cl=HS(r()*360,50,rr(r,35,60)),sk=pk(r,SK),hr=pk(r,HR),t=Math.floor(r()*4);let hair=t==1?`<path d="M11 18Q11 7 20 7Q29 7 29 18L29 27L26 27L26 15Q20 13 14 15L14 27L11 27Z" fill="${hr}"/>`:t==2?`<path d="M10 14Q20 2 30 14Z" fill="${pk(r,['#c0392b','#222','#2c5aa8','#eee'])}"/><rect x="8" y="13" width="24" height="3" rx="1.5" fill="#222"/>`:`<path d="M11.5 17Q11 7 20 7Q29 7 28.5 17Q25 11 20 12Q15 11 11.5 17Z" fill="${hr}"/>`;return `<rect width="40" height="40" fill="${HS(h,40,rr(r,55,85))}"/><path d="M4 40Q4 28 20 28Q36 28 36 40Z" fill="${cl}"/><rect x="17" y="24" width="6" height="6" fill="${sk}"/><circle cx="20" cy="18" r="8.5" fill="${sk}"/>${hair}<circle cx="16.6" cy="19" r=".9" fill="#222"/><circle cx="23.4" cy="19" r=".9" fill="#222"/>`+(t==3?'<circle cx="16.6" cy="19" r="2.6" fill="none" stroke="#222" stroke-width=".7"/><circle cx="23.4" cy="19" r="2.6" fill="none" stroke="#222" stroke-width=".7"/>':'')},
flower(r){const h=r()*360,p=HS(h+rr(r,0,60),75,rr(r,65,80));let c='';for(let k=0;k<6;k++){const a=k*Math.PI/3;c+=`<circle cx="${20+7*Math.cos(a)}" cy="${20+7*Math.sin(a)}" r="5.2" fill="${p}"/>`}return `<rect width="40" height="40" fill="${HS(h+180,40,rr(r,80,92))}"/>${c}<circle cx="20" cy="20" r="4" fill="#ffd54a"/>`},
planet(r){const h=r()*360;let st='';for(let k=0;k<8;k++)st+=`<circle cx="${rr(r,2,38)}" cy="${rr(r,2,38)}" r=".5" fill="#fff"/>`;return `<rect width="40" height="40" fill="${HS(250,50,12)}"/>${st}<circle cx="20" cy="20" r="8" fill="${HS(h,70,60)}"/><ellipse cx="20" cy="20" rx="15" ry="4.5" fill="none" stroke="${HS(h+40,60,80)}" stroke-width="1.6" transform="rotate(-20 20 20)"/>`},
sea(r){const h=rr(r,190,220);return `<rect width="40" height="40" fill="${HS(h,60,rr(r,78,90))}"/><rect y="${rr(r,20,25)}" width="40" height="20" fill="${HS(h+5,70,45)}"/><path d="M0 28q5-3 10 0t10 0 10 0 10 0M0 34q5-3 10 0t10 0 10 0 10 0" stroke="#fff" stroke-opacity=".6" fill="none" stroke-width="1"/><circle cx="${rr(r,8,32)}" cy="9" r="3.5" fill="#fff6c8"/>`},
cup(r){const bg=HS(r()*360,rr(r,40,65),rr(r,78,90)),c=HS(r()*360,60,rr(r,40,60));return `<rect width="40" height="40" fill="${bg}"/><path d="M11 17h16v9a6 6 0 01-6 6h-4a6 6 0 01-6-6z" fill="${c}"/><path d="M27 19h2a3 3 0 010 6h-2" stroke="${c}" fill="none" stroke-width="2"/><ellipse cx="19" cy="33" rx="12" ry="2" fill="#0002"/><path d="M16 13q-2-3 0-5M21 13q-2-3 0-5" stroke="#999" stroke-width="1.2" fill="none"/>`},
